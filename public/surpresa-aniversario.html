<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Surpresa</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;1,500&family=Nunito+Sans:wght@400;600;700;800&display=swap');

  :root{
    --plum: #5B1F4E;
    --magenta: #C2185B;
    --coral: #FF6F91;
    --gold: #FFC857;
    --cream: #FFF6ED;
    --ink: #3A1030;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0; height:100%;
    font-family: 'Nunito Sans', sans-serif;
    color: var(--cream);
  }

  #stage{
    position: relative;
    width: 100%;
    min-height: 100%;
    overflow: hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 20px;
    background: linear-gradient(120deg, var(--plum), var(--magenta), #7A2E8C, var(--coral));
    background-size: 320% 320%;
    animation: driftGradient 18s ease-in-out infinite;
  }

  @keyframes driftGradient{
    0%{ background-position: 0% 40%; }
    50%{ background-position: 100% 60%; }
    100%{ background-position: 0% 40%; }
  }

  canvas#confetti{
    position: fixed; inset:0; width:100%; height:100%;
    pointer-events:none; z-index: 40;
  }

  /* ambient floating particles */
  .particle{
    position:absolute;
    bottom:-60px;
    opacity:0;
    pointer-events:none;
    filter: drop-shadow(0 0 6px rgba(255,255,255,.5));
    animation-name: floatUp;
    animation-timing-function: ease-in;
    animation-iteration-count: infinite;
  }
  @keyframes floatUp{
    0%{ transform: translateY(0) translateX(0) rotate(0deg) scale(.8); opacity:0; }
    10%{ opacity:.9; }
    50%{ transform: translateY(-52vh) translateX(var(--drift,20px)) rotate(180deg) scale(1); }
    90%{ opacity:.7; }
    100%{ transform: translateY(-108vh) translateX(calc(var(--drift,20px) * -1)) rotate(360deg) scale(.6); opacity:0; }
  }

  .card{
    position:relative;
    z-index: 10;
    max-width: 560px;
    width:100%;
    text-align:center;
  }

  .step{
    animation: riseIn .7s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes riseIn{
    from{ opacity:0; transform: translateY(28px) scale(.96); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }

  .heart-pulse{
    display:inline-block;
    animation: pulseBeat 1.8s ease-in-out infinite;
    filter: drop-shadow(0 8px 24px rgba(0,0,0,.35));
  }
  @keyframes pulseBeat{
    0%, 100%{ transform: scale(1); }
    25%{ transform: scale(1.12); }
    40%{ transform: scale(0.98); }
    55%{ transform: scale(1.08); }
  }

  h1.display{
    font-family: 'Fraunces', serif;
    font-weight: 700;
    line-height: 1.05;
    letter-spacing: -0.01em;
    text-shadow: 0 6px 30px rgba(0,0,0,.35);
    margin: 28px 0 8px;
  }

  .eyebrow{
    font-family: 'Nunito Sans', sans-serif;
    font-weight: 800;
    letter-spacing: .18em;
    text-transform: uppercase;
    font-size: 13px;
    color: var(--gold);
    opacity: .95;
  }

  .btn{
    font-family: 'Nunito Sans', sans-serif;
    font-weight: 800;
    font-size: 17px;
    letter-spacing: .01em;
    color: var(--magenta);
    background: var(--cream);
    border: none;
    border-radius: 999px;
    padding: 16px 38px;
    cursor: pointer;
    box-shadow: 0 12px 32px rgba(0,0,0,.35);
    transition: transform .25s ease, box-shadow .25s ease;
    animation: floatBtn 2.6s ease-in-out infinite;
  }
  .btn:hover{ transform: translateY(-3px) scale(1.04); box-shadow: 0 16px 40px rgba(0,0,0,.4); }
  .btn:active{ transform: scale(.96); }
  @keyframes floatBtn{
    0%,100%{ transform: translateY(0); }
    50%{ transform: translateY(-6px); }
  }

  .glass{
    margin-top: 26px;
    background: rgba(255,255,255,.14);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 26px;
    padding: 30px 28px;
    box-shadow: 0 20px 50px rgba(0,0,0,.25);
  }

  .msg{ font-size: 20px; line-height:1.55; font-weight:600; }
  .msg.accent{ color: var(--gold); font-weight:800; margin-top:14px; }

  .sparkle-spin{
    display:inline-block;
    animation: spinSlow 5s linear infinite, bob 2.4s ease-in-out infinite;
  }
  @keyframes spinSlow{ from{ transform: rotate(0deg);} to{ transform: rotate(360deg);} }
  @keyframes bob{ 0%,100%{ transform: translateY(0) rotate(0);} 50%{ transform: translateY(-8px) rotate(8deg);} }

  /* gift box */
  .gift-wrap{
    position:relative;
    width: 260px;
    height: 220px;
    margin: 30px auto 0;
    cursor:pointer;
    animation: hover 2.4s ease-in-out infinite;
  }
  .gift-wrap.opened{ animation:none; cursor:default; }
  @keyframes hover{
    0%,100%{ transform: translateY(0) rotate(0deg); }
    50%{ transform: translateY(-14px) rotate(-3deg); }
  }

  .glow-burst{
    position:absolute;
    top:50%; left:50%;
    width: 320px; height:320px;
    background: radial-gradient(circle, rgba(255,200,87,.9), rgba(255,200,87,0) 70%);
    transform: translate(-50%,-50%) scale(0);
    border-radius:50%;
    opacity:0;
    animation: burst 1.4s ease-out forwards;
  }
  @keyframes burst{
    0%{ transform: translate(-50%,-50%) scale(0); opacity:0; }
    35%{ opacity:1; }
    100%{ transform: translate(-50%,-50%) scale(2.1); opacity:0; }
  }

  .box-lid{
    position:absolute;
    top: 30px; left:0;
    width:100%; height: 78px;
    border-radius: 14px;
    background: linear-gradient(120deg, var(--gold), var(--coral) 55%, var(--magenta));
    border: 4px solid rgba(255,255,255,.4);
    box-shadow: 0 18px 30px rgba(0,0,0,.35);
    z-index:3;
    transition: transform 1.1s cubic-bezier(.3,.6,.2,1);
    transform-origin: 50% 100%;
  }
  .gift-wrap.opened .box-lid{
    transform: translateY(-170px) rotateZ(-35deg) rotateX(-40deg);
  }

  .box-body{
    position:absolute;
    bottom:0; left:0;
    width:100%; height: 150px;
    border-radius: 18px;
    background: linear-gradient(150deg, #7A2E8C, var(--magenta) 55%, var(--plum));
    box-shadow: 0 22px 45px rgba(0,0,0,.4);
    overflow:hidden;
    z-index:2;
    transition: transform .6s ease;
  }
  .gift-wrap.opened .box-body{ animation: settle .7s ease .9s both; }
  @keyframes settle{
    0%{ transform: scale(1); } 40%{ transform: scale(1.08); } 100%{ transform: scale(1); }
  }

  .ribbon-v{
    position:absolute; left:50%; top:0; bottom:0;
    width: 46px; transform: translateX(-50%);
    background: rgba(255,255,255,.9);
  }
  .sheen{
    position:absolute; inset:0;
    background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.35) 50%, transparent 70%);
    animation: sheenMove 2.6s ease-in-out infinite;
  }
  @keyframes sheenMove{
    0%{ transform: translateX(-100%); } 100%{ transform: translateX(100%); }
  }

  .bow{
    position:absolute; top: -46px; left:50%; transform: translateX(-50%);
    font-size: 72px; z-index:4;
    filter: drop-shadow(0 10px 14px rgba(0,0,0,.4));
    transition: transform 1s ease;
  }
  .gift-wrap.opened .bow{
    transform: translateX(-50%) translateY(-190px) rotate(340deg) scale(1.25);
  }

  .tap-hint{
    margin-top: 20px;
    font-weight: 800;
    font-size: 22px;
    animation: pulseBeat 2s ease-in-out infinite;
  }

  /* polaroid */
  .polaroid{
    position:relative;
    background: var(--cream);
    border-radius: 20px;
    padding: 18px 18px 26px;
    box-shadow: 0 30px 70px rgba(0,0,0,.4);
    animation: popIn .9s cubic-bezier(.2,.9,.25,1.2) both;
    max-width: 380px;
    margin: 0 auto;
  }
  @keyframes popIn{
    0%{ opacity:0; transform: scale(.4) rotate(-14deg); }
    70%{ transform: scale(1.04) rotate(2deg); }
    100%{ opacity:1; transform: scale(1) rotate(0deg); }
  }
  .polaroid img{
    display:block;
    width:100%;
    max-height: 420px;
    object-fit: cover;
    border-radius: 12px;
    background: linear-gradient(135deg, #eee, #ddd);
  }
  .polaroid .tape{
    position:absolute; top:-14px; left:50%; transform: translateX(-50%) rotate(-3deg);
    width: 90px; height: 30px;
    background: rgba(255,255,255,.55);
    border: 1px solid rgba(255,255,255,.7);
    box-shadow: 0 4px 10px rgba(0,0,0,.15);
  }
  .polaroid .caption{
    font-family:'Fraunces', serif;
    font-weight:700;
    font-size: 24px;
    color: var(--magenta);
    margin-top: 16px;
  }
  .polaroid .sub{
    color:#8a6a80;
    font-size:15px;
    margin-top:6px;
    font-weight:600;
  }

  .fallback-photo{
    width:100%; height:260px;
    border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    background: linear-gradient(135deg, var(--coral), var(--gold));
    color:white; font-size:56px;
  }

  .dots{
    display:flex; gap:8px; justify-content:center; margin-top: 26px;
  }
  .dot{
    width:8px; height:8px; border-radius:50%;
    background: rgba(255,255,255,.35);
    transition: all .35s ease;
  }
  .dot.active{ background: var(--gold); width:22px; border-radius:6px; }

  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration: .001s !important;
      animation-iteration-count: 1 !important;
      transition-duration: .001s !important;
    }
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="confetti"></canvas>
  <div id="particles"></div>
  <div class="card" id="card"></div>
</div>

<script>
(function(){
  const stage = document.getElementById('stage');
  const cardEl = document.getElementById('card');
  const particlesEl = document.getElementById('particles');
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');

  let step = 1;
  const TOTAL_STEPS = 5;

  function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // ---------- ambient floating sparkles ----------
  const emojis = ['✨','💖','🎉','💫'];
  function spawnParticle(){
    const el = document.createElement('span');
    el.className = 'particle';
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    const size = 14 + Math.random()*22;
    el.style.left = (Math.random()*100) + 'vw';
    el.style.fontSize = size + 'px';
    el.style.setProperty('--drift', (Math.random()*80-40)+'px');
    const duration = 7 + Math.random()*6;
    el.style.animationDuration = duration + 's';
    el.style.animationDelay = (Math.random()*2) + 's';
    particlesEl.appendChild(el);
    setTimeout(()=> el.remove(), (duration+2)*1000);
  }
  for(let i=0;i<18;i++) setTimeout(spawnParticle, i*260);
  setInterval(spawnParticle, 600);

  // ---------- confetti (lightweight custom implementation) ----------
  let confettiPieces = [];
  let confettiRunning = false;
  const confettiColors = ['#FFC857','#FF6F91','#C2185B','#FFF6ED','#7A2E8C'];

  function burstConfetti(count, originY){
    for(let i=0;i<count;i++){
      const angle = Math.random()*Math.PI - Math.PI; // upward spread
      const speed = 6 + Math.random()*10;
      confettiPieces.push({
        x: canvas.width/2 + (Math.random()*260-130),
        y: canvas.height*(originY!==undefined?originY:0.65),
        vx: Math.cos(angle)*speed*0.6 + (Math.random()*4-2),
        vy: -Math.abs(Math.sin(angle)*speed) - 4,
        size: 6+Math.random()*7,
        color: confettiColors[Math.floor(Math.random()*confettiColors.length)],
        rot: Math.random()*360,
        vrot: (Math.random()*10-5),
        shape: Math.random()>0.5 ? 'rect':'circle',
        life: 0,
        maxLife: 130 + Math.random()*60
      });
    }
    if(!confettiRunning){ confettiRunning = true; requestAnimationFrame(tickConfetti); }
  }

  function tickConfetti(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    confettiPieces.forEach(p=>{
      p.vy += 0.16; // gravity
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vrot;
      p.life++;
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, 1 - p.life/p.maxLife);
      if(p.shape === 'rect'){
        ctx.fillRect(-p.size/2, -p.size/3, p.size, p.size*0.66);
      } else {
        ctx.beginPath();
        ctx.arc(0,0,p.size/2,0,Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    });
    confettiPieces = confettiPieces.filter(p => p.life < p.maxLife && p.y < canvas.height + 40);
    if(confettiPieces.length > 0){
      requestAnimationFrame(tickConfetti);
    } else {
      confettiRunning = false;
      ctx.clearRect(0,0,canvas.width,canvas.height);
    }
  }

  // ---------- step renderers ----------
  function renderDots(){
    let html = '<div class="dots">';
    for(let i=1;i<=TOTAL_STEPS;i++){
      html += `<div class="dot ${i===step?'active':''}"></div>`;
    }
    html += '</div>';
    return html;
  }

  function goTo(n){
    step = n;
    render();
  }

  function render(){
    cardEl.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'step';

    if(step === 1){
      wrap.innerHTML = `
        <div class="eyebrow">é hoje ✨</div>
        <div class="heart-pulse" style="font-size:90px;">❤️</div>
        <h1 class="display" style="font-size:44px;">Tenho uma surpresa pra você</h1>
        <button class="btn" id="btn1">Clique aqui ✨</button>
        ${renderDots()}
      `;
      cardEl.appendChild(wrap);
      document.getElementById('btn1').addEventListener('click', ()=> goTo(2));
    }

    else if(step === 2){
      wrap.innerHTML = `
        <div class="sparkle-spin" style="font-size:72px;">🌟</div>
        <h1 class="display" style="font-size:48px;">Feliz aniversário 🎂</h1>
        <div class="glass">
          <p class="msg">Que seu dia seja cheio de alegria, sorrisos e momentos especiais.</p>
          <p class="msg accent">Você merece tudo de melhor ✨</p>
        </div>
        <button class="btn" id="btn2" style="margin-top:26px;">Continuar 💖</button>
        ${renderDots()}
      `;
      cardEl.appendChild(wrap);
      document.getElementById('btn2').addEventListener('click', ()=> goTo(3));
    }

    else if(step === 3){
      wrap.innerHTML = `
        <div class="sparkle-spin" style="font-size:80px; animation-duration:4s;">🎁</div>
        <h1 class="display" style="font-size:42px;">Tenho algo especial para você</h1>
        <p class="msg" style="color:var(--gold); font-weight:700;">Clique no presente e descubra uma surpresa ❤️</p>
        <button class="btn" id="btn3" style="margin-top:8px;">Abrir presente 🎁</button>
        ${renderDots()}
      `;
      cardEl.appendChild(wrap);
      document.getElementById('btn3').addEventListener('click', ()=> goTo(4));
    }

    else if(step === 4){
      wrap.innerHTML = `
        <div class="gift-wrap" id="giftWrap">
          <div class="bow">🎀</div>
          <div class="box-lid"></div>
          <div class="box-body">
            <div class="ribbon-v"></div>
            <div class="sheen"></div>
          </div>
        </div>
        <div class="tap-hint" id="tapHint">Toque para abrir 🎁</div>
        ${renderDots()}
      `;
      cardEl.appendChild(wrap);

      const giftWrap = document.getElementById('giftWrap');
      let opened = false;
      giftWrap.addEventListener('click', ()=>{
        if(opened) return;
        opened = true;
        giftWrap.classList.add('opened');
        document.getElementById('tapHint').style.display = 'none';

        const glow = document.createElement('div');
        glow.className = 'glow-burst';
        giftWrap.appendChild(glow);

        burstConfetti(140, 0.55);
        setTimeout(()=> burstConfetti(120, 0.3), 350);

        setTimeout(()=> goTo(5), 1900);
      });
    }

    else if(step === 5){
      wrap.innerHTML = `
        <div class="polaroid">
          <div class="tape"></div>
          <img src="/foto.jpeg" alt="Foto especial"
               onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'fallback-photo',innerHTML:'💖'}))" />
          <div class="caption">Uma lembrança especial ❤️</div>
          <div class="sub">Que esse momento fique guardado para sempre ✨</div>
        </div>
        ${renderDots()}
      `;
      cardEl.appendChild(wrap);
      burstConfetti(90, 0.2);
    }
  }

  render();
})();
</script>
</body>
</html>
